[server]
bind = "0.0.0.0"
port = 3032
db_path = "./data/tiddlers.sqlite3"  # 数据库存储路径
files_dir = "./files/"               # 本地文件存储路径

# 在 Wiki 修订记录中显示的用户名
[status]
username = "YourName" 

# [可选] HTTP 基础认证
# 如果注释掉此部分，服务器将允许匿名访问
[auth]
username = "admin"
password = "change_me_please"

[s3]
enable = true
name = "r2"
access_key = "YOUR_AWS_ACCESS_KEY"
secret_key = "YOUR_AWS_SECRET_KEY"
# 示例：Cloudflare R2 的 endpoint
endpoint = "https://<ACCOUNT_ID>.r2.cloudflarestorage.com"
region = "auto"
bucket_name = "your-wiki-assets"
# 你的资源公开访问域名
public_url_base = "https://assets.your-domain.com"

# [可选] 自动备份到 S3
# 启用后，服务器定期检查变更并自动备份到 S3
[backup]
enable = false                         # 启用自动备份
interval_hours = 24                    # 检查间隔（小时）
retention_count = 7                    # S3 保留最近 N 个备份
s3_bucket = "wiki-backups"            # 备份目标 bucket（复用上方 [s3] 的凭证）
s3_prefix = "backups/"                # 对象存储前缀
